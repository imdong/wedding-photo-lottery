services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    expose:
      - "8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env}"
      APP_URL: http://localhost:39538
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wedding_photo_lottery
      DB_USERNAME: wedding
      DB_PASSWORD: wedding
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -c
      - composer install --no-interaction --prefer-dist && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wedding_photo_lottery
      MYSQL_USER: wedding
      MYSQL_PASSWORD: wedding
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: node:24-alpine
    working_dir: /var/www/html
    expose:
      - "5173"
    environment:
      APP_URL: http://localhost:39538
      VITE_API_PROXY_TARGET: http://app:8000
    volumes:
      - .:/var/www/html
      - node-modules-data:/var/www/html/node_modules
    depends_on:
      app:
        condition: service_healthy
    command:
      - sh
      - -c
      - npm install --no-audit --no-fund && npm run dev
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/@vite/client"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  proxy:
    image: nginx:1.29-alpine
    ports:
      - "39538:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mysql-data:
  node-modules-data:
  vendor-data:
